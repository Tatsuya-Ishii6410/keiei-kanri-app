<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新旧ダッシュボードの数字の突き合わせ</title>
<style>
  body{margin:0;font-family:'Noto Sans JP',sans-serif;background:#F8FAFF;color:#17233D}
  #out{padding:12px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap}
  .ok{color:#047857}.ng{color:#BE123C;font-weight:700}
  iframe{border:0;width:100%;height:900px;background:#fff}
  body.narrow iframe{width:375px;height:812px}
</style></head>
<body>
<!-- 使い方：リポジトリの直下で `python -m http.server 8765` を実行し、
     http://localhost:8765/tests/dashboard-v2-compare.html を開く（?narrow でスマホ幅 375px）。
     アプリは GAS_URL を空にして読み込むので、スプレッドシートには読み書きしない（このページの localStorage だけを使う）。
     見本のデータを入れ、旧ダッシュボードの表示と新ダッシュボードの数字が一致するかを表にする -->
<div id="out">読み込み中…</div>
<iframe id="f" title="アプリ"></iframe>
<script>
if(location.search.indexOf('narrow')>=0)document.body.classList.add('narrow');
if(location.search.indexOf('tall')>=0)document.getElementById('f').style.height='3200px';
try{localStorage.clear();localStorage.setItem('bizapp_session_v1',JSON.stringify({expires:Date.now()+86400000}));}catch(e){}
const results=[];
const check=(name,a,b)=>results.push({name,ok:a===b,a,b});
const yen=t=>{const m=/(−|-)?¥\s*(-)?([\d,]+)/.exec(String(t||''));return m?(m[1]||m[2]?-1:1)*parseInt(m[3].replace(/,/g,''),10):NaN};
const num=t=>{const m=/(-?[\d.]+)/.exec(String(t||''));return m?parseFloat(m[1]):NaN};

fetch('../keiei-kanri.html').then(r=>r.text()).then(src=>{
  const f=document.getElementById('f');
  f.onload=()=>setTimeout(run,800);
  f.srcdoc=src.replace(/^const GAS_URL='[^']*';/m,"const GAS_URL='';");
});

function run(){
  const w=document.getElementById('f').contentWindow,d=w.document;
  try{
    w.alert=()=>{};w.confirm=()=>true;
    const S=w.eval('S');
    const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1;
    const ym=(dy,dm)=>{const a=y*12+(m-1)+dm+dy*12;return Math.floor(a/12)+'-'+String(a%12+1).padStart(2,'0')};
    // 見本：今期（今月を含む12か月）、案件3件、収支、入金予定（遅延あり）
    S.fiscalYears=[{id:1,name:'見本の期',startMonth:ym(0,-5),endMonth:ym(0,6),salesTarget:6000000,profitTarget:1000000,active:true,
      newCustomerTarget:3,retentionTarget:'',winRateTarget:50}];
    S.currentFiscalYearId=1;
    S.projects=[
      {id:1,name:'保守',client:'株式会社A',amount:300000,status:'進行中',start:ym(0,-8)+'-01',end:ym(0,10)+'-28',contract:'monthly',invoiceStatus:'invoiced'},
      {id:2,name:'開発',client:'B商事',amount:200000,status:'進行中',start:ym(0,-2)+'-01',end:ym(0,3)+'-28',contract:'monthly',invoiceStatus:'uninvoiced'},
      {id:3,name:'提案',client:'C社',amount:100000,status:'失注',start:ym(0,-1)+'-01',end:'',contract:'single',invoiceStatus:'uninvoiced'}];
    S.ledger=[
      {id:1,date:ym(0,0)+'-05',type:'通信料',desc:'回線',amount:55000,status:'actual'},
      {id:2,date:ym(0,0)+'-10',type:'役員報酬',desc:'役員報酬',amount:200000,status:'actual'},
      {id:3,date:ym(0,-1)+'-10',type:'システム利用料',desc:'SaaS',amount:33000,status:'actual'},
      {id:4,date:ym(0,-1)+'-20',expectedDate:ym(0,-1)+'-20',type:'売上',desc:'株式会社A 入金予定',amount:330000,status:'planned_in',projectId:1,billingMonth:ym(0,-2)},
      {id:5,date:ym(0,-3)+'-15',type:'その他経費',desc:'機器購入',amount:900000,status:'actual'}];   // 営業利益がマイナスの月（縦軸の0より下）
    S.bankBalance=1234567;S.nextLedgerId=6;
    w.renderFiscalSelects();
    d.getElementById('fiscal-select').value='1';
    d.getElementById('month-select').value=String(now.getMonth());
    w.setDashVersion(2,true);
    w.updateDashboard();
    setTimeout(()=>{
      const kpi=key=>{const el=d.querySelector(`[data-key="kpi-${key}"]`);return el?parseFloat(el.dataset.count):NaN};
      check('月間売上（旧「売上」＝新KPI）',yen(d.getElementById('d-sales').textContent),kpi('sales'));
      check('営業利益（旧「営業利益」＝新KPI）',yen(d.getElementById('d-profit').textContent),kpi('profit'));
      check('現預金残高（設定の値＝新KPI）',w.bankBalance(),kpi('cash'));
      // 残高0（未設定と区別できない）は「未設定（または0円）」と出し、¥0 にしない
      const keepCash=S.bankBalance;S.bankBalance=0;w.updateDashboard();
      check('残高0は「未設定（または0円）」',/未設定/.test(d.querySelector('#dv2-kpis .dv2-kpi:nth-child(4) .dv2-kpi-val').textContent),true);
      S.bankBalance=keepCash;w.updateDashboard();
      const fs=d.getElementById('fiscal-summary').querySelectorAll('tbody tr')[0].querySelectorAll('td');
      const fy=w.dashboardFiscalYear();
      // 確定の累計（ヒーロー）＝着地予測カードの「確定（実績）」
      const heroConfirmed=yen((d.querySelector('#dv2-hero .dv2-hero-row b')||{}).textContent);
      const dl=d.querySelector('#dv2-hero .dv2-hero-nums');
      const fcConfirmed=heroConfirmed,fcPlanned=yen(dl.querySelector('.plan b').textContent),fcTotal=parseFloat(dl.dataset.total);
      check('確定の実績（山登り）＝期首〜当月の案件ベースの売上',heroConfirmed,w.fiscalAbsMonths(fy).filter(a=>a<=w.dashV2Data().curAbs).reduce((t,a)=>t+w.projectSalesAtAbsTotal(a),0));
      // ★ 達成率は確定だけ：pct(確定の累計, 期の売上目標)。ヒーロー＝KPI
      check('達成率（確定）＝pct(確定, 目標)（ヒーロー）',w.pct(fcConfirmed,fy.salesTarget),num(d.querySelector('#dv2-hero .dv2-big').textContent));
      check('達成率（確定）＝KPIカード',num(d.querySelector('#dv2-hero .dv2-big').textContent),kpi('rate'));
      // 予測込みは着地見込み＝期間サマリーの達成率
      check('着地見込み＝期間サマリーの達成率（予測込み）',num(fs[3].textContent),num(d.querySelector('#dv2-hero .dv2-landing .dv2-chip').textContent));
      check('確定＋予測（着地見込みの金額）＝期間サマリーの売上（同じ関数）',yen(fs[2].textContent),fcTotal);
      check('確定＋予測＝合計',fcConfirmed+fcPlanned,fcTotal);
      // アクションセンターの件数＝状態の行（同じ集計）。完了は緑の小さな行（0件）
      const act=key=>{const el=d.querySelector(`#dv2-actions-list [data-key="${key}"]`);if(!el)return NaN;return el.classList.contains('dv2-done-chip')?0:parseInt(el.dataset.count||'0',10);};
      const od=(d.getElementById('d-overdue-status').textContent.match(/(\d+)件/)||[])[1];
      check('入金遅延の件数（状態の行＝アクションセンター）',parseInt(od||'0',10),act('overdue'));
      const cl=(d.getElementById('d-close-status').textContent.match(/未解決\s*(\d+)件/)||[])[1];
      check('月次締めの未解決（状態の行＝アクションセンター）',parseInt(cl||'0',10),act('close'));
      const inv=(d.getElementById('d-invoice-status').textContent.match(/未作成\s*(\d+)件/)||[])[1];
      check('未作成の請求書（状態の行＝アクションセンター）',parseInt(inv||'0',10),act('invoice'));
      const clMis=d.querySelector('#dv2-missions [data-key="close"] .dv2-m-title');
      check('月次締めの解決率（ミッション）は同じ未解決の件数から',/（\d+／\d+）/.test(clMis&&clMis.textContent)&&clMis.textContent.indexOf('／')>0,true);
      // 経営コンディション：残高は出金予定より多い、入金遅延が1件 → 入金の確認
      check('経営コンディション（入金遅延あり）',d.getElementById('dv2-cond').dataset.key,'overdue');
      // 今日の優先アクション＝アクションセンターの未完了の上位3件
      const top=[...d.querySelectorAll('#dv2-today .dv2-act')].map(x=>x.dataset.key).join(',');
      const todo=[...d.querySelectorAll('#dv2-actions-list .dv2-act')].map(x=>x.dataset.key).slice(0,3).join(',');
      check('今日の優先アクション＝アクションセンターの上位3件',top,todo);
      check('通知の件数＝アクションセンターの未完了',parseInt(d.getElementById('dv2-bell-n').textContent||'0',10),d.querySelectorAll('#dv2-actions-list .dv2-act').length);
      check('当月は営業利益に「月途中」の注記',!!d.querySelector('#dv2-kpis .dv2-mid'),true);
      check('縦軸に0の目盛り（マイナスの月があるとき）',[...d.querySelectorAll('#dv2-trend .dv2-axis')].some(t=>t.textContent==='0')&&[...d.querySelectorAll('#dv2-trend .dv2-axis')].some(t=>/^−/.test(t.textContent)),true);
      check('状態の行6つがアクションセンターの「状態の詳細」にある',d.querySelectorAll('#dv2-slot-status #dv-status > div[id^="d-"]').length,6);
      check('メトリクス7枚が詳細データにある',d.querySelectorAll('#dv2-slot-metrics .metric-card').length,7);
      check('横スクロールが出ない',d.documentElement.scrollWidth<=w.innerWidth,true);
      // 旧に切り替えると元の場所に戻る
      w.setDashVersion(1,true);
      check('旧に切り替え：メトリクスが元の場所',d.querySelectorAll('#dvh-metrics .metric-card').length,7);
      check('旧に切り替え：新画面は非表示',d.getElementById('dash-v2').style.display,'none');
      w.setDashVersion(2,true);
      const ng=results.filter(r=>!r.ok).length;
      document.getElementById('out').innerHTML=`<b>${ng?'<span class="ng">一致しない項目があります</span>':'<span class="ok">すべて一致</span>'}</b>（${results.length}項目）\n`
        +results.map(r=>`<span class="${r.ok?'ok':'ng'}">${r.ok?'✓':'✗'}</span> ${r.name}：旧/基準 ${r.a} ／ 新 ${r.b}`).join('\n');
      document.title=ng?'NG':'OK';
    },700);
  }catch(e){document.getElementById('out').innerHTML='<span class="ng">エラー</span> '+e.stack;document.title='ERROR';}
}
</script>
</body></html>
